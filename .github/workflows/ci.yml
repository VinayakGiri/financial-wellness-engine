name: FinWell CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Run Unit Tests & Model Verification
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Data Ingestion & PII Parsers (14 tests)
      run: |
        pytest tests/test_adapters.py -v

    - name: Validate ML Engines & Analytical Pipeline (62 tests)
      run: |
        MPLCONFIGDIR=/tmp/matplotlib python tests/test_models.py

    - name: Syntax & Import Sanity Check
      run: |
        python -c "
        import src.data_adapter
        import src.engine_1_behavior
        import src.engine_2_leakage
        import src.engine_3_predictive
        print('All core engines and adapters imported successfully!')
        "
